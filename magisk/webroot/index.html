<style>

<body>
<div class="app-shell">
<header class="app-bar">
  <div class="brand"><span class="brand-mark">MP</span><span class="brand-name" data-i18n="appTitle">MiPush Zygisk</span></div>
  <div class="bar-actions">
    <div class="menu" data-menu-root>
      <button id="language-trigger" class="menu-trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="compact-label" id="language-label">English</span></button>
      <div id="language-menu" class="menu-panel" role="listbox" hidden><button class="menu-option" data-language="zh-CN" role="option">中文</button><button class="menu-option" data-language="en" role="option">English</button></div>
    </div>
    <div class="menu" data-menu-root>
      <button id="theme-trigger" class="menu-trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="compact-label" id="theme-label">跟随系统</span></button>
      <div id="theme-menu" class="menu-panel" role="listbox" hidden><button class="menu-option" data-theme-choice="system" role="option">跟随系统</button><button class="menu-option" data-theme-choice="light" role="option">浅色</button><button class="menu-option" data-theme-choice="dark" role="option">深色</button></div>
    </div>
    <button id="refresh" class="icon-button" type="button" aria-label="刷新" title="刷新">↻</button>
  </div>
</header>
<main>
<section class="summary"><div><div class="eyebrow" data-i18n="runtimeLabel">Runtime</div><h1 id="hero-state" data-i18n="loadingTitle">正在读取</h1><p id="hero-description" data-i18n="summaryDescription">配置通过统一命令入口读取，应用级修改会重启目标进程。</p></div><div class="status-chip"><span id="status-dot" class="status-dot"></span><span id="status-pill-text" data-i18n="loading">读取中</span></div></section>
<section id="stats" class="stats" aria-label="状态"></section><div id="debug-line" class="debug-line" hidden></div>
<section class="card"><div class="section-head"><div><div class="section-kicker" data-i18n="runtimeSectionKicker">运行配置</div><h2 class="section-title" data-i18n="runtimeSectionTitle">Profile 与开关</h2></div><p class="section-note" data-i18n="runtimeSectionNote">模块状态与 spoof 状态分开显示。</p></div>
  <div class="row"><div class="row-copy"><div class="row-title" data-i18n="spoofTitle">第三方应用伪装</div><div class="row-detail" data-i18n="spoofDetail">关闭后不再对第三方进程注入属性，XMSF marker 独立保留。</div></div><label class="switch"><input id="spoof" type="checkbox" aria-label="第三方应用伪装"><span class="switch-track"><span class="switch-thumb"></span></span></label></div>
  <div class="row"><div class="row-copy"><div class="row-title" data-i18n="observeTitle">观察属性读取</div><div class="row-detail" data-i18n="observeDetail">对新启动的进程生效。</div></div><label class="switch"><input id="observe" type="checkbox" aria-label="观察属性读取"><span class="switch-track"><span class="switch-thumb"></span></span></label></div>
  <div class="row"><div class="row-copy"><div class="row-title" data-i18n="profileTitle">设备档位</div><div class="row-detail" data-i18n="profileDetail">修改后需要重启。</div></div><div class="select-menu" data-select-root="profile"><button id="profile-trigger" class="menu-trigger select-button" type="button" aria-haspopup="listbox" aria-expanded="false">— <span class="chevron">⌄</span></button><div id="profile-menu" class="menu-panel" role="listbox" hidden><button class="menu-option" data-profile="miui14" role="option">MIUI 14</button><button class="menu-option" data-profile="os4" role="option">HyperOS 4</button></div></div></div>
</section>
<section class="card"><div class="section-head"><div><div class="section-kicker" data-i18n="cutSectionKicker">挂载边界</div><h2 class="section-title" data-i18n="cutSectionTitle">精简模块</h2></div><p class="section-note" data-i18n="cutSectionNote">当前 overlay 只读，模式变更在下次重装时应用。</p></div>
  <div class="row"><div class="row-copy"><div class="row-title" data-i18n="currentState">当前状态</div><div id="cut-detail" class="row-detail" data-i18n="loading">读取中</div></div><strong id="cut-active" class="value">—</strong></div>
  <div class="row"><div class="row-copy"><div class="row-title" data-i18n="nextMode">下次安装模式</div><div class="row-detail" data-i18n="nextModeDetail">选择后需要重装模块。</div></div><div class="select-menu" data-select-root="mode"><button id="mode-trigger" class="menu-trigger select-button" type="button" aria-haspopup="listbox" aria-expanded="false">— <span class="chevron">⌄</span></button><div id="mode-menu" class="menu-panel" role="listbox" hidden><button class="menu-option" data-mode="" role="option" data-i18n="noChange">不改变</button><button class="menu-option" data-mode="spoof" role="option" data-i18n="modeSpoof">只伪装</button><button class="menu-option" data-mode="cut" role="option" data-i18n="modeCut">只隐藏 XMSF</button><button class="menu-option" data-mode="both" role="option" data-i18n="modeBoth">隐藏 XMSF 并伪装</button></div></div></div>
</section>
<section class="card"><div class="section-head"><div><div class="section-kicker" data-i18n="appsSectionKicker">伪装范围</div><h2 class="section-title" data-i18n="appsSectionTitle">应用列表</h2></div><p id="apps-note" class="section-note" data-i18n="appsSectionNote">仅列出已安装且接入小米推送的应用；开关会写入配置并重启对应应用。</p></div>
  <div class="apps-toolbar"><span id="app-count" class="apps-count">—</span></div><div id="apps" class="app-list" aria-live="polite"></div>
</section>
</main>
</div>
<div id="notice" class="notice" role="status" aria-live="polite"></div>

 'zh-CN':{appTitle:'MiPush Zygisk',runtimeLabel:'运行状态',loadingTitle:'正在读取',readyTitle:'模块已就绪',offlineTitle:'模块不可用',summaryDescription:'配置通过统一命令入口读取，应用级修改会重启目标进程。',loading:'读取中',runtimeAvailable:'运行中',runtimeUnavailable:'不可用',module:'模块',spoof:'伪装',cut:'精简',profile:'档位',pending:'待安装',on:'已开启',off:'已关闭',none:'无',runtimeSectionKicker:'运行配置',runtimeSectionTitle:'Profile 与开关',runtimeSectionNote:'模块状态与 spoof 状态分开显示。',spoofTitle:'伪装总开关',spoofDetail:'关闭后应用列表开关暂不生效，XMSF marker 独立保留。',observeTitle:'观察属性读取',observeDetail:'对新启动的进程生效。',profileTitle:'设备档位',profileDetail:'修改后需要重启。',cutSectionKicker:'挂载边界',cutSectionTitle:'精简模块',cutSectionNote:'当前 overlay 只读，模式变更在下次重装时应用。',currentState:'当前状态',nextMode:'下次安装模式',nextModeDetail:'选择后需要重装模块。',noChange:'不改变',modeSpoof:'只伪装',modeCut:'只隐藏 XMSF',modeBoth:'隐藏 XMSF 并伪装',appsSectionKicker:'伪装范围',appsSectionTitle:'应用列表',appsSectionNote:'仅列出已安装且接入小米推送的应用；开关会写入配置并重启对应应用。',appsDisabledNote:'伪装总开关关闭，应用项暂不生效；开启总开关后按列表执行。',appsSummary:(enabled,total)=>`已允许 ${enabled} / 共 ${total}`,noCandidates:'未发现接入小米推送的应用',saved:'已保存',forceStop:'正在保存并重启应用…',profileSaved:'档位已保存，请重启设备',modeSaved:'安装模式已保存，请重装模块',observeSaved:'观察开关已保存，新进程生效',spoofSaved:'伪装开关已保存，新进程生效',refresh:'刷新',language:'语言',theme:'主题',system:'跟随系统',light:'浅色',dark:'深色',error:'读取失败',apiUnavailable:'执行接口不可用'},

function bridgeExec(command){return new Promise((resolve,reject)=>{const callbackName=`__mipushExec_${Date.now()}_${++callbackSeq}`;let timer;const finish=(errno,stdout,stderr)=>{clearTimeout(timer);delete window[callbackName];resolve({errno:Number(errno??0),stdout:String(stdout??''),stderr:String(stderr??'')})};window[callbackName]=finish;timer=setTimeout(()=>{delete window[callbackName];reject(new Error('执行接口超时'))},10000);try{window.ksu.exec(command,null,callbackName)}catch(error){clearTimeout(timer);delete window[callbackName];reject(error)}})}

function menuValue(value,kind){if(kind==='profile')return value==='os4'?'HyperOS 4':'MIUI 14';if(!value)return t('noChange');return t(value==='spoof'?'modeSpoof':value==='cut'?'modeCut':'modeBoth')}
function setMenu(id,labelText,value){$(id+'-trigger').firstChild.textContent=labelText;$(id+'-menu').querySelectorAll('.menu-option').forEach(option=>option.setAttribute('aria-selected',String((option.dataset.profile??option.dataset.mode??'')===value)))}
function renderStatus(status){state.status=status;const live=status.module_enabled==='true';$('hero-state').textContent=live?t('readyTitle'):t('offlineTitle');$('status-dot').className=live?'status-dot':'status-dot off';$('status-pill-text').textContent=live?t('runtimeAvailable'):t('runtimeUnavailable');$('cut-active').textContent=label(status.cut_active);$('cut-active').className=status.cut_active==='enabled'?'value active':status.pending_mode?'value warning':'value';$('cut-detail').textContent=status.pending_mode?`${t('pending')}: ${menuValue(status.pending_mode)}`:t('currentState');setMenu('profile',menuValue(status.profile,'profile'),status.profile||'miui14');setMenu('mode',menuValue(status.pending_mode),status.pending_mode||'');$('spoof').checked=status.spoof==='on';$('observe').checked=status.observe==='true';$('stats').replaceChildren();[['module',label(status.module_enabled)],['spoof',label(status.spoof)],['cut',label(status.cut_active)],['profile',status.profile||'—']].forEach(([key,value])=>{const metric=document.createElement('div');metric.className='metric';const labelEl=document.createElement('div');labelEl.className='metric-label';labelEl.textContent=t(key);const valueEl=document.createElement('div');valueEl.className='metric-value'+(key==='spoof'&&status.spoof==='off'?' accent':'');valueEl.textContent=value;metric.append(labelEl,valueEl);$('stats').append(metric)})}
function packageInfo(names){if(!names.length)return[];try{if(window.ksu&&typeof window.ksu.getPackagesInfo==='function')return JSON.parse(window.ksu.getPackagesInfo(JSON.stringify(names)));const pm=window.ksu&&typeof window.ksu.pm==='function'?window.ksu.pm():null;if(pm&&typeof pm.getPackagesInfo==='function')return JSON.parse(pm.getPackagesInfo(JSON.stringify(names)))}catch(error){setDebug(`package info failed: ${error?.message||error}`,true)}return[]}
function loadLabels(packages){const missing=packages.filter(pkg=>!state.labels.has(pkg));if(!missing.length)return;for(const item of packageInfo(missing)){const pkg=String(item.packageName||'');const appLabel=String(item.appLabel||'').trim();if(pkg&&appLabel&&!item.error)state.labels.set(pkg,appLabel)}}
function appItems(){const packages=new Set(state.candidates);return [...packages].map(pkg=>({pkg,label:state.labels.get(pkg)||pkg,enabled:state.rules.get(pkg)===true})).sort((a,b)=>Number(b.enabled)-Number(a.enabled)||a.label.localeCompare(b.label,state.locale))}
function renderApps(){const items=appItems();const enabled=items.filter(item=>item.enabled).length;const spoofEnabled=state.status?.spoof==='on';$('app-count').textContent=items.length?t('appsSummary',enabled,items.length):'—';$('apps-note').textContent=spoofEnabled?t('appsSectionNote'):t('appsDisabledNote');const root=$('apps');root.replaceChildren();if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=t('noCandidates');root.append(empty);return}for(const item of items){const row=document.createElement('div');row.className=spoofEnabled?'app-row':'app-row app-row-disabled';const visual=document.createElement('span');visual.className='app-visual';const avatar=document.createElement('span');avatar.className='app-avatar';avatar.textContent=(item.label||item.pkg).slice(0,1).toUpperCase();visual.append(avatar);const icon=document.createElement('img');icon.className='app-icon';icon.alt='';icon.loading='lazy';icon.src=`ksu://icon/${encodeURIComponent(item.pkg)}`;icon.onload=()=>avatar.remove();icon.onerror=()=>icon.remove();visual.append(icon);const copy=document.createElement('div');copy.className='app-copy';const name=document.createElement('div');name.className='app-name';name.textContent=item.label;const pkg=document.createElement('div');pkg.className='app-package';pkg.textContent=item.pkg;copy.append(name,pkg);const toggle=document.createElement('label');toggle.className='switch';const input=document.createElement('input');input.type='checkbox';input.checked=item.enabled;input.disabled=!spoofEnabled;input.setAttribute('aria-label',item.pkg);const track=document.createElement('span');track.className='switch-track';const thumb=document.createElement('span');thumb.className='switch-thumb';track.append(thumb);toggle.append(input,track);input.onchange=async()=>{input.disabled=true;try{setNotice(t('forceStop'));await ctl(input.checked?'enable':'disable',item.pkg);await refresh();setNotice(t('saved'))}catch(error){input.checked=!input.checked;input.disabled=false;setNotice(error.message,true)}};row.append(visual,copy,toggle);root.append(row)}}
async function refresh(){const button=$('refresh');button.classList.add('is-loading');try{const [statusText,rulesText,candidatesText]=await Promise.all([ctl('status'),ctl('apps'),ctl('scan')]);state.status=kv(statusText);state.rules=parseRules(rulesText);state.candidates=candidatesText.split(/\r?\n/).map(item=>item.trim()).filter(Boolean);loadLabels([...new Set(state.candidates)]);renderStatus(state.status);renderApps();setNotice(t('saved'))}catch(error){setNotice(error.message,true)}finally{button.classList.remove('is-loading')}}
function closeMenus(){document.querySelectorAll('.menu-panel').forEach(panel=>{panel.hidden=true});document.querySelectorAll('.menu-trigger').forEach(trigger=>trigger.setAttribute('aria-expanded','false'))}
function setupMenu(triggerId,menuId,handler){const trigger=$(triggerId),menu=$(menuId);trigger.onclick=event=>{event.stopPropagation();const open=!menu.hidden;closeMenus();menu.hidden=open;trigger.setAttribute('aria-expanded',String(!open))};menu.querySelectorAll('.menu-option').forEach(option=>option.onclick=async()=>{closeMenus();await handler(option)})}
document.addEventListener('click',closeMenus);setupMenu('language-trigger','language-menu',async option=>{state.locale=option.dataset.language;localStorage.setItem('mipush.locale',state.locale);applyI18n()});setupMenu('theme-trigger','theme-menu',async option=>{state.theme=option.dataset.themeChoice;applyTheme()});setupMenu('profile-trigger','profile-menu',async option=>{if(option.dataset.profile===state.status?.profile)return;try{await ctl('profile',option.dataset.profile);setNotice(t('profileSaved'));await refresh()}catch(error){setNotice(error.message,true)}});setupMenu('mode-trigger','mode-menu',async option=>{const value=option.dataset.mode;if(!value)return;try{await ctl('mode',value);setNotice(t('modeSaved'));await refresh()}catch(error){setNotice(error.message,true)}});
$('refresh').onclick=refresh;$('spoof').onchange=async e=>{try{await ctl('spoof',e.target.checked?'on':'off');setNotice(t('spoofSaved'));await refresh()}catch(error){e.target.checked=!e.target.checked;setNotice(error.message,true)}};$('observe').onchange=async e=>{try{await ctl('observe',e.target.checked?'true':'false');setNotice(t('observeSaved'));await refresh()}catch(error){e.target.checked=!e.target.checked;setNotice(error.message,true)}};
async function initRuntime(){setDebug('loading execution API',false);try{if(window.ksu&&typeof window.ksu.exec==='function'){execMode='bridge';setDebug('',false);console.log('[MiPush WebUI] bridge execution API ready');await refresh();return}const api=await import('kernelsu');rootExec=api.exec;if(typeof rootExec!=='function')throw new Error('exec export missing');execMode='module';setDebug('',false);console.log('[MiPush WebUI] module execution API ready');await refresh()}catch(error){setDebug(`API import failed: ${error?.message||error}`,true);setNotice(t('apiUnavailable'),true)}}
applyTheme();initRuntime();
</script>
</body>
</html>
