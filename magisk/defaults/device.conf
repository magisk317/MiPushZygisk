# MiPush Zygisk device spoof config
#
# Defines the fake device that hooked apps will observe. The values below are
# the built-in default profile (Redmi K30 5G / picasso). Edit freely.
#
# Format:
#   [system]          android.os.SystemProperties.get(...) overrides
#   [build]           android.os.Build.<FIELD> overrides
#   [build.version]   android.os.Build.VERSION.<FIELD> overrides
#
#   key=value         one property per line; empty value hides the property
#
# Per-package overrides (merged on top of the global profile above; only the
# keys you list are replaced, everything else is inherited):
#   [com.example.app:system]
#   ro.product.model=Some Other Model
#   [com.example.app:build]
#   MODEL=Some Other Model
#
# If this file is missing or contains no usable properties, the module falls
# back to the built-in default profile.

