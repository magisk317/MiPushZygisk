[package]
name = "mipush_zygisk"
version = "1.0.1"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "mipush_zygisk"
crate-type = ["cdylib"]

[dependencies]
android_logger = "0.15"
jni = "0.21"
log = "0.4"
zygisk-api = { git = "https://gitlab.com/magisk3171/zygisk-api-rs", rev = "f945a2003f0dc63c4b3a4773b6ca3df834cdeb2f" }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
