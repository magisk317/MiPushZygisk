[package]
name = "mipush_zygisk"
# Keep in sync with MiPushFramework gradle/libs.versions.toml (versionName/versionCode);
# bump together on every framework release bump.
version = "1.1.2"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "mipush_zygisk"
crate-type = ["cdylib"]

[dependencies]
android_logger = "0.15"
jni = "0.22"
libc = "0.2"
log = "0.4"
zygisk-api = { git = "https://gitlab.com/magisk3171/zygisk-api-rs.git", tag = "v0.0.2" }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
