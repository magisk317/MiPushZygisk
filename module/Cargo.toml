[package]
name = "mipush_zygisk"
version = "1.0.1"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "mipush_zygisk"
crate-type = ["cdylib"]

[dependencies]
android_logger = "0.15"
jni = "0.22"
log = "0.4"
zygisk-api = { git = "https://gitlab.com/magisk3171/zygisk-api-rs", rev = "8ce05efb09378ac70dd75d168cd60b2e80ac577e" }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
