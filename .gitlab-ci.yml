workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  tags:
    - magisk-local-linux

stages:
  - build

variables:
  GIT_DEPTH: "0"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  RUSTUP_DIST_SERVER: "https://mirrors.tuna.tsinghua.edu.cn/rustup"
  RUSTUP_UPDATE_ROOT: "https://mirrors.tuna.tsinghua.edu.cn/rustup/rustup"
  ANDROID_NDK_VERSION: "r27d"
  ANDROID_NDK_HOME: "$CI_PROJECT_DIR/.android/android-ndk-r27d"

.configure_debian_tuna: &configure_debian_tuna |
  sed -i \
    -e 's#http://deb.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
    -e 's#http://security.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
    -e 's#http://deb.debian.org/debian#https://mirrors.tuna.tsinghua.edu.cn/debian#g' \
    /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true

.configure_cargo_tuna: &configure_cargo_tuna |
  mkdir -p "$CARGO_HOME"
  cat > "$CARGO_HOME/config.toml" <<'EOF'
  [source.crates-io]
  replace-with = "tuna"

  [source.tuna]
  registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"

  [net]
  git-fetch-with-cli = true
  EOF

check:zygisk:
  image: "rust:1-bookworm"
  stage: build
  before_script:
    - *configure_cargo_tuna
  cache:
    key: "cargo-check-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - module/target/
  script:
    - |
      set -euo pipefail
      if ! rustup component add rustfmt; then
        echo "Rustup mirror failed, falling back to official server" >&2
        export RUSTUP_DIST_SERVER="https://static.rust-lang.org"
        export RUSTUP_UPDATE_ROOT="https://static.rust-lang.org/rustup"
        rustup component add rustfmt
      fi
      cd module
      cargo fmt --check
      cargo check --locked

build:zygisk:
  image: "rust:1-bookworm"
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        MAGISK_BUILD_TYPE: "release"
        MAGISK_BUILD_TIMESTAMP: ""
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
      variables:
        MAGISK_BUILD_TYPE: "debug"
        MAGISK_BUILD_TIMESTAMP: "$CI_PIPELINE_CREATED_AT"
    - when: never
  cache:
    key: "cargo-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - module/target/
  before_script:
    - *configure_debian_tuna
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl git unzip zip
    - *configure_cargo_tuna
    - |
      if ! rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; then
        echo "Rustup mirror failed, falling back to official server" >&2
        export RUSTUP_DIST_SERVER="https://static.rust-lang.org"
        export RUSTUP_UPDATE_ROOT="https://static.rust-lang.org/rustup"
        rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      fi
    - mkdir -p .android
    - |
      set -euo pipefail
      if [ ! -d "$ANDROID_NDK_HOME" ]; then
        curl --retry 5 --retry-all-errors --continue-at - --fail --location --silent --show-error \
          "https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip" \
          --output /tmp/android-ndk.zip
        unzip -q /tmp/android-ndk.zip -d .android
      fi
  script:
    - |
      if [[ -n "${CI_COMMIT_TAG:-}" ]]; then
        ./scripts/check_release_tag.sh "$CI_COMMIT_TAG"
      fi
    - ./build.sh
  artifacts:
    name: "MiPushZygisk-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - build/*.zip
