workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  tags:
    - magisk-local-linux

stages:
  - build

variables:
  GIT_DEPTH: "0"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  ANDROID_NDK_VERSION: "r27d"
  ANDROID_NDK_HOME: "$CI_PROJECT_DIR/.android/android-ndk-r27d"

check:zygisk:
  image: "rust:1-bookworm"
  stage: build
  cache:
    key: "cargo-check-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - module/target/
  script:
    - |
      set -euo pipefail
      rustup component add rustfmt
      cd module
      cargo fmt --check
      cargo check --locked

build:zygisk:
  image: "rust:1-bookworm"
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never
  cache:
    key: "cargo-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - module/target/
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl git unzip zip
    - rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
    - mkdir -p .android
    - |
      set -euo pipefail
      if [ ! -d "$ANDROID_NDK_HOME" ]; then
        curl --retry 5 --fail --location --silent --show-error \
          "https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip" \
          --output /tmp/android-ndk.zip
        unzip -q /tmp/android-ndk.zip -d .android
      fi
  script:
    - ./build.sh
  artifacts:
    name: "MiPushZygisk-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - build/*.zip
