include:
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: v1
    file: /.gitlab/ci/cancel-mr-pipelines.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  tags:
    - magisk-arm64-linux

stages:
  - build
  - package
  - sync

variables:
  GIT_DEPTH: "0"
  MAGISK_CI_TOOLKIT_REF: "v1"
  MAGISK_TELEGRAM_PIN: "off"
  MAGISK_CANCEL_OLDER_MR_PIPELINES: "true"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  ANDROID_NDK_VERSION: "r30-beta3"
  ANDROID_NDK_HOME: "$CI_PROJECT_DIR/.android/android-ndk-r30-beta3"

.configure_debian_sources: &configure_debian_sources |
  set -euo pipefail
  use_mirror="${MAGISK_LINUX_USE_MIRROR:-true}"
  if [[ "$use_mirror" == "true" ]]; then
    sed -i \
      -e 's#http://deb.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
      -e 's#http://security.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
      -e 's#http://deb.debian.org/debian#https://mirrors.tuna.tsinghua.edu.cn/debian#g' \
      /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
  fi
  if ! apt-get update; then
    if [[ "$use_mirror" != "true" ]]; then
      exit 1
    fi
    echo "Mirror apt source failed, falling back to official sources" >&2
    sed -i \
      -e 's#https://mirrors.tuna.tsinghua.edu.cn/debian-security#http://deb.debian.org/debian-security#g' \
      -e 's#https://mirrors.tuna.tsinghua.edu.cn/debian#http://deb.debian.org/debian#g' \
      /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
    apt-get update
  fi

.configure_cargo_registry: &configure_cargo_registry |
  set -euo pipefail
  mkdir -p "$CARGO_HOME"
  cat > "$CARGO_HOME/config.toml" <<'EOF'
  [net]
  git-fetch-with-cli = true
  EOF
  if [[ "${MAGISK_LINUX_USE_MIRROR:-true}" == "true" ]]; then
    cat >> "$CARGO_HOME/config.toml" <<'EOF'

  [source.crates-io]
  replace-with = "runner-registry"

  [source.runner-registry]
  registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"
  EOF
  fi

check:zygisk:
  image: "rust:1.98.0-trixie"
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - when: never
  before_script:
    - *configure_cargo_registry
  cache:
    key: "cargo-check-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - module/target/
  script:
    - |
      set -euo pipefail
      if [[ "${MAGISK_LINUX_USE_MIRROR:-true}" == "true" ]]; then
        export RUSTUP_DIST_SERVER="https://mirrors.tuna.tsinghua.edu.cn/rustup"
        export RUSTUP_UPDATE_ROOT="https://mirrors.tuna.tsinghua.edu.cn/rustup/rustup"
      else
        export RUSTUP_DIST_SERVER="https://static.rust-lang.org"
        export RUSTUP_UPDATE_ROOT="https://static.rust-lang.org/rustup"
      fi
      if ! rustup component add rustfmt; then
        echo "Rustup mirror failed, falling back to official server" >&2
        export RUSTUP_DIST_SERVER="https://static.rust-lang.org"
        export RUSTUP_UPDATE_ROOT="https://static.rust-lang.org/rustup"
        rustup component add rustfmt
      fi
      ./scripts/test_mipushctl.sh
      cd module
      cargo fmt --check
      cargo test --locked
      cargo check --locked

.build_zygisk:
  image: "rust:1.98.0-trixie"
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        MAGISK_BUILD_TYPE: "release"
        MAGISK_BUILD_TIMESTAMP: ""
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
      variables:
        MAGISK_BUILD_TYPE: "debug"
        MAGISK_BUILD_TIMESTAMP: "$CI_PIPELINE_CREATED_AT"
    - when: never
  cache:
    key: "cargo-$MIPUSH_ZYGISK_RUNNER_GROUP-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - module/target/
  before_script:
    - *configure_debian_sources
    - apt-get install -y --no-install-recommends ca-certificates clang curl git lld unzip zip
    - *configure_cargo_registry
    - |
      set -euo pipefail
      if [[ "${MAGISK_LINUX_USE_MIRROR:-true}" == "true" ]]; then
        export RUSTUP_DIST_SERVER="https://mirrors.tuna.tsinghua.edu.cn/rustup"
        export RUSTUP_UPDATE_ROOT="https://mirrors.tuna.tsinghua.edu.cn/rustup/rustup"
      else
        export RUSTUP_DIST_SERVER="https://static.rust-lang.org"
        export RUSTUP_UPDATE_ROOT="https://static.rust-lang.org/rustup"
      fi
      if ! rustup target add $MIPUSH_ZYGISK_RUST_TARGETS; then
        echo "Rustup mirror failed, falling back to official server" >&2
        export RUSTUP_DIST_SERVER="https://static.rust-lang.org"
        export RUSTUP_UPDATE_ROOT="https://static.rust-lang.org/rustup"
        rustup target add $MIPUSH_ZYGISK_RUST_TARGETS
      fi
    - mkdir -p .android
    - |
      set -euo pipefail
      if [ ! -d "$ANDROID_NDK_HOME" ]; then
        curl --retry 5 --retry-all-errors --continue-at - --fail --location --silent --show-error \
          "https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip" \
          --output /tmp/android-ndk.zip
        unzip -q /tmp/android-ndk.zip -d .android
      fi
  script:
    - |
      if [[ -n "${CI_COMMIT_TAG:-}" ]]; then
        ./scripts/check_release_tag.sh "$CI_COMMIT_TAG"
      fi
    - ./build.sh
  artifacts:
    name: "MiPushZygisk-$MIPUSH_ZYGISK_RUNNER_GROUP-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - build/*.zip
      - magisk/zygisk/*.so

build:zygisk:arm:
  extends: .build_zygisk
  tags:
    - magisk-arm64-linux
  variables:
    MIPUSH_ZYGISK_RUNNER_GROUP: "arm"
    MIPUSH_ZYGISK_BUILD_ABIS: "arm64-v8a armeabi-v7a"
    MIPUSH_ZYGISK_RUST_TARGETS: "aarch64-linux-android armv7-linux-androideabi"
    MIPUSH_ZYGISK_PACKAGE_UNIVERSAL: "false"

build:zygisk:x86:
  extends: .build_zygisk
  tags:
    - magisk-amd64-linux
  variables:
    MIPUSH_ZYGISK_RUNNER_GROUP: "x86"
    MIPUSH_ZYGISK_BUILD_ABIS: "x86 x86_64"
    MIPUSH_ZYGISK_RUST_TARGETS: "i686-linux-android x86_64-linux-android"
    MIPUSH_ZYGISK_PACKAGE_UNIVERSAL: "false"

package:zygisk:universal:
  image: "debian:trixie-slim"
  stage: package
  tags:
    - magisk-arm64-linux
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        MAGISK_BUILD_TYPE: "release"
        MAGISK_BUILD_TIMESTAMP: ""
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
      variables:
        MAGISK_BUILD_TYPE: "debug"
        MAGISK_BUILD_TIMESTAMP: "$CI_PIPELINE_CREATED_AT"
    - when: never
  needs:
    - job: build:zygisk:arm
      artifacts: true
    - job: build:zygisk:x86
      artifacts: true
  before_script:
    - *configure_debian_sources
    - apt-get install -y --no-install-recommends zip
  script:
    - MIPUSH_ZYGISK_SKIP_BUILD=true MIPUSH_ZYGISK_PACKAGE_UNIVERSAL=true ./build.sh
  artifacts:
    name: "MiPushZygisk-universal-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - build/universal_*.zip

cancel:older:mr:pipelines:
  extends: .magisk_cancel_older_mr_pipelines

sync:github:
  stage: sync
  needs: []
  image: alpine:latest
  tags:
    - magisk-arm64-linux
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'
    - when: never
  before_script:
    - apk add --no-cache git
  script:
    - |
      set -euo pipefail
      # GITHUB_PAT is a group-level protected variable, so it is only injected on
      # protected refs. Tag pipelines receive it only when the tag matches a
      # protected tag rule (v*); otherwise fall back to a project-level
      # GITHUB_RELEASE_TOKEN when one is configured.
      sync_token="${GITHUB_PAT:-${GITHUB_RELEASE_TOKEN:-}}"
      if [ -z "$sync_token" ]; then
        echo "ERROR: neither GITHUB_PAT nor GITHUB_RELEASE_TOKEN is available on $CI_COMMIT_REF_NAME (protected=$CI_COMMIT_REF_PROTECTED)" >&2
        echo "       Make the tag match a protected tag rule (e.g. v*) so the protected group variable is injected." >&2
        exit 1
      fi
      git remote add github "https://magisk317:${sync_token}@github.com/magisk317/${CI_PROJECT_NAME}.git" || true
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        git push github "$CI_COMMIT_TAG" --force
        git push github --tags --force
      else
        git push github "HEAD:refs/heads/$CI_COMMIT_BRANCH" --force
      fi
